<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Saya</title>

    <style>
        /* Gaya Umum */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            background-color: #1DB954;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: #121212;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin: 0 15px;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #ffffff;
        }

        /* Kontainer Halaman */
        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* Gaya untuk Gambar */
        img {
            width: 100%;
            max-width: 200px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Tombol */
        .button {
            display: inline-block;
            background-color: #1DB954;
            color: #121212;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #1aa34a;
            color: #ffffff;
        }

        /* Responsif */
        @media (max-width: 600px) {
            .navbar a {
                display: block;
                margin: 5px 0;
            }
        }
    </style>

</head>
